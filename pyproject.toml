[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",  # CAMBIO: Faltaba uvicorn, por eso no lo encontraba Docker
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",           # CAMBIO: Necesario para SQLAlchemy Async
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",  # RECOMENDACIÓN: Para manejar el .env profesionalmente
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "structlog>=24.1.0",
    "email-validator>=2.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.18"
]
[tool.ruff]
line-length = 88
target-version = "py312"
src=["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL"]
ignore=[]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
mypy_path="src"

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = false
